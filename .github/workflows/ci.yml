name: UCMS CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          cd Ui-prototype/ucms-ui
          npm install

      - name: Build React App
        run: |
          cd cd Ui-prototype/ucms-ui
          npm run build